<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/fragments :: head('顾客登录')}"></head>
<body>

<div class="auth-wrap">
    <div class="auth-card">
        <div class="whale">🐳</div>
        <h2>顾客登录</h2>
        <div class="error-msg" th:if="${error}" th:text="${error}">错误信息</div>
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>用户名</label>
                <input class="form-control" type="text" name="username" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input class="form-control" type="password" name="password" placeholder="请输入密码" required>
            </div>
            <div class="form-group">
                <label>验证码</label>
                <div class="captcha-row">
                    <input class="form-control" type="text" name="captcha" placeholder="请输入验证码" maxlength="4" autocomplete="off" required>
                    <img class="captcha-img" th:src="@{/captcha}" alt="验证码" title="看不清？点击刷新"
                         onclick="this.src='/captcha?t=' + new Date().getTime()">
                </div>
            </div>
            <button class="btn btn-block" type="submit">登 录</button>
        </form>
        <div class="auth-links">
            还没有账号？<a th:href="@{/register}">立即注册</a><br>
            <a th:href="@{/admin/login}">管理员登录</a> ·
            <a th:href="@{/}">返回首页</a>
        </div>
    </div>
</div>

</body>
</html>
