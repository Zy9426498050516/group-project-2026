<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/fragments :: head('顾客注册')}"></head>
<body>

<div class="auth-wrap">
    <div class="auth-card">
        <div class="whale">🐳</div>
        <h2>顾客注册</h2>
        <div class="error-msg" th:if="${error}" th:text="${error}">错误信息</div>
        <form th:action="@{/register}" method="post">
            <div class="form-group">
                <label>用户名</label>
                <input class="form-control" type="text" name="username" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input class="form-control" type="password" name="password" placeholder="请输入密码" required>
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input class="form-control" type="password" name="confirmPassword" placeholder="请再次输入密码" required>
            </div>
            <button class="btn btn-block" type="submit">注 册</button>
        </form>
        <div class="auth-links">
            已有账号？<a th:href="@{/login}">去登录</a> ·
            <a th:href="@{/}">返回首页</a>
        </div>
    </div>
</div>

</body>
</html>
