<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/fragments :: head('编辑轮播图')}"></head>
<body>
<header th:replace="~{common/fragments :: admin-header}"></header>

<div class="admin-layout">
    <aside th:replace="~{common/fragments :: admin-sidebar('banner')}"></aside>
    <main class="admin-main">
        <h2 th:text="${banner.id == null} ? '➕ 新增海报' : '✏️ 编辑海报'">海报表单</h2>

        <div class="table-card" style="padding: 24px; max-width: 560px;">
            <form th:action="${banner.id == null} ? '/admin/banner/add' : '/admin/banner/update'"
                  method="post" enctype="multipart/form-data">
                <input type="hidden" name="id" th:value="${banner.id}">
                <div class="form-group">
                    <label>标题</label>
                    <input class="form-control" type="text" name="title" th:value="${banner.title}" placeholder="例如：蓝色海洋季活动">
                </div>
                <div class="form-group">
                    <label>排序（数字越小越靠前）</label>
                    <input class="form-control" type="number" name="sortOrder" th:value="${banner.sortOrder}" min="0">
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <select class="form-control" name="status">
                        <option value="1" th:selected="${banner.status == null or banner.status == 1}">✅ 启用</option>
                        <option value="0" th:selected="${banner.status != null and banner.status == 0}">⛔ 禁用</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>海报图片（从本地电脑上传）</label>
                    <div th:if="${banner.image != null and !banner.image.isEmpty()}" style="margin-bottom: 10px;">
                        <img th:src="${banner.image}" style="width: 100%; border-radius: 12px;" alt="当前海报">
                    </div>
                    <input class="form-control" type="file" name="file" accept="image/*" th:required="${banner.id == null}">
                    <div style="font-size:12px; color:#8aa0b8; margin-top:6px;">编辑时不选文件则保留原图</div>
                </div>
                <div style="display:flex; gap:12px;">
                    <button class="btn" type="submit">💾 保存</button>
                    <a class="btn btn-gray" th:href="@{/admin/banner}">返回</a>
                </div>
            </form>
        </div>
    </main>
</div>

</body>
</html>
