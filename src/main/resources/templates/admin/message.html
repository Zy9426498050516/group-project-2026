<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/fragments :: head('消息通知')}"></head>
<body>
<header th:replace="~{common/fragments :: admin-header}"></header>
<div class="admin-layout">
    <aside th:replace="~{common/fragments :: admin-sidebar('message')}"></aside>
    <main class="admin-main">
        <h2>🔔 消息通知</h2>
        <div class="table-card" style="padding:20px; margin-bottom:20px; max-width:640px;">
            <form th:action="@{/admin/profile/message/add}" method="post">
                <div class="form-group"><label>标题</label><input class="form-control" type="text" name="title" required></div>
                <div class="form-group"><label>内容</label><textarea class="form-control" name="content" rows="3" required></textarea></div>
                <button class="btn" type="submit">➕ 发布通知</button>
            </form>
        </div>
        <div class="table-card">
            <table class="table">
                <thead><tr><th>ID</th><th>标题</th><th>内容</th><th>时间</th><th>操作</th></tr></thead>
                <tbody>
                <tr th:each="m : ${messages}">
                    <td th:text="${m.id}">1</td>
                    <td th:text="${m.title}">标题</td>
                    <td th:text="${m.content}">内容</td>
                    <td th:text="${m.createTime}">时间</td>
                    <td><a class="btn btn-sm btn-danger" th:href="@{/admin/profile/message/delete/{id}(id=${m.id})}" onclick="return confirm('确定删除？')">删除</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
