<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/fragments :: head('销售管理')}"></head>
<body>
<header th:replace="~{common/fragments :: admin-header}"></header>
<div class="admin-layout">
    <aside th:replace="~{common/fragments :: admin-sidebar('sales')}"></aside>
    <main class="admin-main">
        <h2>💰 销售管理</h2>
        <div class="stat-grid">
            <div class="stat-card blue"><div class="stat-icon">📦</div><div><div class="num" th:text="${todayOrders}">0</div><div class="label">今日订单</div></div></div>
            <div class="stat-card green"><div class="stat-icon">💵</div><div><div class="num" th:text="'¥' + ${todaySales}">0</div><div class="label">今日销售额</div></div></div>
            <div class="stat-card orange"><div class="stat-icon">🏆</div><div><div class="num" th:text="'¥' + ${totalSales}">0</div><div class="label">累计销售额</div></div></div>
            <div class="stat-card pink"><div class="stat-icon">⏳</div><div><div class="num" th:text="${pendingCount}">0</div><div class="label">待发货订单</div></div></div>
        </div>
        <div class="dash-panel full">
            <h3>🕐 最近订单</h3>
            <div class="table-card">
                <table class="table">
                    <thead><tr><th>订单号</th><th>顾客</th><th>金额</th><th>状态</th><th>下单时间</th></tr></thead>
                    <tbody>
                    <tr th:each="o : ${recentOrders}">
                        <td th:text="${o.orderNo}">订单号</td>
                        <td th:text="${o.customerName}">顾客</td>
                        <td th:text="'¥' + ${o.totalAmount}">金额</td>
                        <td th:text="${o.status}">状态</td>
                        <td th:text="${o.createTime}">时间</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
