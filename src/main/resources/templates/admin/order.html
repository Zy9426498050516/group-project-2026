<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/fragments :: head('订单列表')}"></head>
<body>
<header th:replace="~{common/fragments :: admin-header}"></header>
<div class="admin-layout">
    <aside th:replace="~{common/fragments :: admin-sidebar('order')}"></aside>
    <main class="admin-main">
        <h2>📦 订单列表</h2>
        <div class="search-bar" style="margin-bottom:16px;">
            <a class="chip" th:href="@{/admin/order}" th:classappend="${status == null} ? 'active' : ''">全部</a>
            <a class="chip" th:each="s : ${ {'待发货','已发货','已完成','已取消'} }" th:href="@{/admin/order(status=${s})}" th:text="${s}" th:classappend="${status == s} ? 'active' : ''">状态</a>
        </div>
        <div class="table-card">
            <table class="table">
                <thead><tr><th>订单号</th><th>顾客</th><th>金额</th><th>状态</th><th>收货人</th><th>下单时间</th><th>操作</th></tr></thead>
                <tbody>
                <tr th:each="o : ${orders}">
                    <td th:text="${o.orderNo}">订单号</td>
                    <td th:text="${o.customerName}">顾客</td>
                    <td th:text="'¥' + ${o.totalAmount}">金额</td>
                    <td th:text="${o.status}">状态</td>
                    <td th:text="${o.receiver}">收货人</td>
                    <td th:text="${o.createTime}">时间</td>
                    <td>
                        <div class="actions">
                            <a class="btn btn-sm" th:href="@{/admin/order/detail/{id}(id=${o.id})}">详情</a>
                            <form th:action="@{/admin/order/status}" method="post" style="display:inline;">
                                <input type="hidden" name="id" th:value="${o.id}">
                                <select name="status" class="form-control" style="width:90px; display:inline-block; padding:4px 8px;">
                                    <option value="待发货" th:selected="${o.status == '待发货'}">待发货</option>
                                    <option value="已发货" th:selected="${o.status == '已发货'}">已发货</option>
                                    <option value="已完成" th:selected="${o.status == '已完成'}">已完成</option>
                                    <option value="已取消" th:selected="${o.status == '已取消'}">已取消</option>
                                </select>
                                <button class="btn btn-sm" type="submit">改</button>
                            </form>
                            <a class="btn btn-sm btn-danger" th:href="@{/admin/order/delete/{id}(id=${o.id})}" onclick="return confirm('确定删除该订单？')">删除</a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
