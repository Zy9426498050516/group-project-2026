<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/fragments :: head('快递公司')}"></head>
<body>
<header th:replace="~{common/fragments :: admin-header}"></header>
<div class="admin-layout">
    <aside th:replace="~{common/fragments :: admin-sidebar('express')}"></aside>
    <main class="admin-main">
        <h2>📮 快递公司</h2>
        <div class="table-card" style="padding:20px; margin-bottom:20px; max-width:640px;">
            <form th:action="@{/admin/ops/express/add}" method="post" style="display:flex; gap:10px;">
                <input class="form-control" style="flex:1;" type="text" name="name" placeholder="快递公司名称" required>
                <input class="form-control" style="width:140px;" type="text" name="code" placeholder="编码">
                <button class="btn" type="submit">➕ 新增</button>
            </form>
        </div>
        <div class="table-card">
            <table class="table">
                <thead><tr><th>ID</th><th>公司名称</th><th>编码</th><th>操作</th></tr></thead>
                <tbody>
                <tr th:each="e : ${list}">
                    <td th:text="${e.id}">1</td>
                    <td>
                        <form th:action="@{/admin/ops/express/update}" method="post" style="display:flex; gap:8px;">
                            <input type="hidden" name="id" th:value="${e.id}">
                            <input class="form-control" style="width:160px;" type="text" name="name" th:value="${e.name}" required>
                            <input class="form-control" style="width:100px;" type="text" name="code" th:value="${e.code}">
                            <button class="btn btn-sm" type="submit">保存</button>
                        </form>
                    </td>
                    <td th:text="${e.code}">编码</td>
                    <td><a class="btn btn-sm btn-danger" th:href="@{/admin/ops/express/delete/{id}(id=${e.id})}" onclick="return confirm('确定删除？')">删除</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
