<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/fragments :: head('编辑公告')}"></head>
<body>
<header th:replace="~{common/fragments :: admin-header}"></header>
<div class="admin-layout">
    <aside th:replace="~{common/fragments :: admin-sidebar('announcement')}"></aside>
    <main class="admin-main">
        <h2 th:text="${announcement.id == null} ? '➕ 新增公告' : '✏️ 编辑公告'">公告表单</h2>
        <div class="table-card" style="padding:24px; max-width:640px;">
            <form th:action="${announcement.id == null} ? '/admin/announcement/add' : '/admin/announcement/update'" method="post">
                <input type="hidden" name="id" th:value="${announcement.id}">
                <div class="form-group">
                    <label>标题</label>
                    <input class="form-control" type="text" name="title" th:value="${announcement.title}" required>
                </div>
                <div class="form-group">
                    <label>内容</label>
                    <textarea class="form-control" name="content" rows="6" th:text="${announcement.content}" required></textarea>
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <select class="form-control" name="status">
                        <option value="1" th:selected="${announcement.status == null or announcement.status == 1}">✅ 启用</option>
                        <option value="0" th:selected="${announcement.status != null and announcement.status == 0}">⛔ 禁用</option>
                    </select>
                </div>
                <div style="display:flex; gap:12px;">
                    <button class="btn" type="submit">💾 保存</button>
                    <a class="btn btn-gray" th:href="@{/admin/announcement}">返回</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
