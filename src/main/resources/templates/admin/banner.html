<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/fragments :: head('轮播图管理')}"></head>
<body>
<header th:replace="~{common/fragments :: admin-header}"></header>

<div class="admin-layout">
    <aside th:replace="~{common/fragments :: admin-sidebar('banner')}"></aside>
    <main class="admin-main">
        <h2>🖼️ 轮播图 / 活动海报管理</h2>

        <div class="toolbar">
            <span style="color:#8aa0b8;">共 <span th:text="${banners.size()}">0</span> 张海报</span>
            <a class="btn" th:href="@{/admin/banner/add}">➕ 新增海报</a>
        </div>

        <div class="table-card">
            <table class="table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>图片</th>
                    <th>标题</th>
                    <th>排序</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="b : ${banners}">
                    <td th:text="${b.id}">1</td>
                    <td>
                        <img class="thumb" th:if="${b.image != null and !b.image.isEmpty()}" th:src="${b.image}" th:alt="${b.title}">
                        <span class="thumb-placeholder" th:if="${b.image == null or b.image.isEmpty()}">🖼️</span>
                    </td>
                    <td th:text="${b.title}">标题</td>
                    <td th:text="${b.sortOrder}">0</td>
                    <td>
                        <span class="chip" th:if="${b.status == 1}">✅ 启用</span>
                        <span class="chip" style="background:#fff0f2;color:#ff6b81;" th:if="${b.status == 0}">⛔ 禁用</span>
                    </td>
                    <td>
                        <div class="actions">
                            <a class="btn btn-sm" th:href="@{/admin/banner/edit/{id}(id=${b.id})}">编辑</a>
                            <a class="btn btn-sm btn-danger" th:href="@{/admin/banner/delete/{id}(id=${b.id})}"
                               onclick="return confirm('确定删除该海报吗？')">删除</a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

</body>
</html>
