<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/fragments :: head('运费模板')}"></head>
<body>
<header th:replace="~{common/fragments :: admin-header}"></header>
<div class="admin-layout">
    <aside th:replace="~{common/fragments :: admin-sidebar('shipping')}"></aside>
    <main class="admin-main">
        <h2>🚚 运费模板</h2>
        <div class="table-card" style="padding:20px; margin-bottom:20px; max-width:760px;">
            <form th:action="@{/admin/ops/shipping/add}" method="post" style="display:flex; gap:10px; flex-wrap:wrap;">
                <input class="form-control" style="flex:1; min-width:120px;" type="text" name="name" placeholder="模板名称" required>
                <input class="form-control" style="width:100px;" type="number" step="0.01" name="firstWeight" placeholder="首重" required>
                <input class="form-control" style="width:100px;" type="number" step="0.01" name="firstPrice" placeholder="首费" required>
                <input class="form-control" style="width:100px;" type="number" step="0.01" name="continuePrice" placeholder="续费" required>
                <button class="btn" type="submit">➕ 新增</button>
            </form>
        </div>
        <div class="table-card">
            <table class="table">
                <thead><tr><th>ID</th><th>模板名称</th><th>首重(kg)</th><th>首费(元)</th><th>续费(元/kg)</th><th>操作</th></tr></thead>
                <tbody>
                <tr th:each="t : ${list}">
                    <td th:text="${t.id}">1</td>
                    <td th:text="${t.name}">名称</td>
                    <td th:text="${t.firstWeight}">首重</td>
                    <td th:text="${t.firstPrice}">首费</td>
                    <td th:text="${t.continuePrice}">续费</td>
                    <td><a class="btn btn-sm btn-danger" th:href="@{/admin/ops/shipping/delete/{id}(id=${t.id})}" onclick="return confirm('确定删除？')">删除</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
