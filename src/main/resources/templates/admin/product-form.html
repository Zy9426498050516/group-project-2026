<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/fragments :: head('编辑商品')}"></head>
<body>
<header th:replace="~{common/fragments :: admin-header}"></header>

<div class="admin-layout">
    <aside th:replace="~{common/fragments :: admin-sidebar('product')}"></aside>
    <main class="admin-main">
        <h2 th:text="${product.id == null} ? '➕ 新增商品' : '✏️ 编辑商品'">商品表单</h2>

        <div class="table-card" style="padding: 24px; max-width: 620px;">
            <form th:action="${product.id == null} ? '/admin/product/add' : '/admin/product/update'"
                  method="post" enctype="multipart/form-data">
                <input type="hidden" name="id" th:value="${product.id}">

                <div class="form-group">
                    <label>商品名称</label>
                    <input class="form-control" type="text" name="name" th:value="${product.name}" placeholder="例如：小蓝鲸毛绒玩偶" required>
                </div>

                <div class="form-group">
                    <label>所属品牌</label>
                    <select class="form-control" name="brandId" required>
                        <option value="" disabled th:selected="${product.brandId == null}">请选择品牌</option>
                        <option th:each="b : ${brands}" th:value="${b.id}"
                                th:selected="${product.brandId == b.id}" th:text="${b.name}">品牌</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>价格（元）</label>
                    <input class="form-control" type="number" step="0.01" min="0" name="price" th:value="${product.price}" placeholder="例如：39.90" required>
                </div>

                <div class="form-group">
                    <label>库存数量</label>
                    <input class="form-control" type="number" min="0" name="stock" th:value="${product.stock}" placeholder="例如：100" required>
                </div>

                <div class="form-group">
                    <label>商品描述</label>
                    <textarea class="form-control" name="description" rows="3" th:text="${product.description}" placeholder="简单描述一下商品"></textarea>
                </div>

                <div class="form-group">
                    <label>商品图片（从本地电脑上传）</label>
                    <div th:if="${product.image != null and !product.image.isEmpty()}" style="margin-bottom: 10px;">
                        <img th:src="${product.image}" style="width: 120px; height: 120px; object-fit: cover; border-radius: 12px;" alt="当前图片">
                    </div>
                    <input class="form-control" type="file" name="file" accept="image/*">
                    <div style="font-size:12px; color:#8aa0b8; margin-top:6px;">编辑时不选文件则保留原图</div>
                </div>

                <div style="display:flex; gap:12px;">
                    <button class="btn" type="submit">💾 保存</button>
                    <a class="btn btn-gray" th:href="@{/admin/product}">返回</a>
                </div>
            </form>
        </div>
    </main>
</div>

</body>
</html>
